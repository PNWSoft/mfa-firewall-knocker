name: build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Advisories are published against code that hasn't changed, so re-run weekly
    # rather than only on push.
    - cron: '0 6 * * 1'

jobs:
  build:
    name: Build (${{ matrix.os }}, AllowTotp=${{ matrix.allow_totp }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both OS targets are supported, so both must keep compiling. MFAService has
        # separate Windows (PowerShell/NetSecurity) and Linux (iptables) code paths.
        os: [ windows-latest, ubuntu-latest ]
        # TOTP is conditionally compiled. The default build must stay green, and so
        # must the opt-in one -- code behind #if ALLOW_TOTP is invisible to the
        # default build, so without this matrix leg it could rot unnoticed.
        allow_totp: [ 'false', 'true' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MFA.slnx --locked-mode

      - name: Build
        run: dotnet build MFA.slnx -c Release --no-restore -p:AllowTotp=${{ matrix.allow_totp }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MFA.slnx --locked-mode

      # Fails the build on any known advisory, including transitive ones.
      #
      # This gate exists because of a real incident: MFAWeb pins
      # Microsoft.IdentityModel.* to 6.34.0 purely to lift Fido2 3.0.1's dependency
      # chain above 6.17.0, which carries GHSA-59j7-ghrg-fj52. The pins look unused,
      # so they invite deletion -- and deleting them silently reintroduces the
      # advisory. This step catches that, and any future drift, automatically.
      - name: Fail on vulnerable packages
        run: |
          set -o pipefail
          dotnet list MFA.slnx package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qiE '^\s*>' audit.txt; then
            echo "::error::Vulnerable package(s) detected - see the listing above."
            exit 1
          fi
          echo "No vulnerable packages."

      # Informational only: the 6.x IdentityModel line and LettuceEncrypt are both
      # marked Legacy, and are accepted trade-offs documented in SECURITY.md.
      - name: Report deprecated packages
        continue-on-error: true
        run: dotnet list MFA.slnx package --deprecated

  reproducible:
    name: Reproducible managed assemblies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build twice and compare
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore MFA.slnx --locked-mode
          dotnet build MFA.slnx -c Release --no-restore
          sha256sum \
            MFAAdmin/bin/Release/net10.0/MFAAdmin.dll \
            MFAService/bin/Release/net10.0/MFAService.dll \
            MFAWeb/bin/Release/net10.0/MFAWeb.dll > "$RUNNER_TEMP/first.sha256"

          dotnet clean MFA.slnx -c Release
          dotnet restore MFA.slnx --locked-mode
          dotnet build MFA.slnx -c Release --no-restore
          sha256sum \
            MFAAdmin/bin/Release/net10.0/MFAAdmin.dll \
            MFAService/bin/Release/net10.0/MFAService.dll \
            MFAWeb/bin/Release/net10.0/MFAWeb.dll > "$RUNNER_TEMP/second.sha256"

          diff -u "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"
